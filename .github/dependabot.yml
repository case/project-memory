    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /tests/linux
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
